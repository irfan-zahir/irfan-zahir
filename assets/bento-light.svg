<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 262" width="1000" height="262" role="img" aria-label="What I do: Web apps — Fast, polished interfaces with React and Next.js.; Mobile — Cross-platform apps from a single codebase.; Backend — APIs, auth and data, self-hosted when it fits.; Local AI — Running and wiring up models on Apple Silicon.">
<title>What I do: Web apps — Fast, polished interfaces with React and Next.js.; Mobile — Cross-platform apps from a single codebase.; Backend — APIs, auth and data, self-hosted when it fits.; Local AI — Running and wiring up models on Apple Silicon.</title>
