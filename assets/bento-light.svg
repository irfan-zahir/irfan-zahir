.on{animation:on .01s backwards}
@keyframes on{from,to{opacity:0}}
.ty{animation:ty .01s backwards}
@keyframes ty{from,to{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
