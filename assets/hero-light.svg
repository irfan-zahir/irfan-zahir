<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Irfan Zahir — full-stack developer building web and mobile apps, and running AI models locally">
<title>Irfan Zahir — full-stack developer building web and mobile apps, and running AI models locally</title>
<defs></defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.caret{animation:caret 1.1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{fill-opacity:0}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.on{animation:on .01s backwards}
@keyframes on{from,to{opacity:0}}
.ty{animation:ty .01s backwards}
@keyframes ty{from,to{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tick{animation:tick 38s linear infinite}@keyframes tick{to{transform:translateX(-1045px)}}.spin{animation:spin 26s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
